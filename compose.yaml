services:
  ui:
    build:
      context: .
      args:
        API_BASE_URL: ${API_BASE_URL:-http://api:3000}
    ports:
      - "3003:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/witness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
networks:
  data:
    external: true
    name: bara-data
